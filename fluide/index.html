<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fluide</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e8eaf0;--mut:#9aa1b2;--ok:#2fbf71;--slow:#f2a93b;--jam:#e5484d;--acc:#4c8dff}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:16px;max-width:640px;margin-inline:auto}
  header{display:flex;justify-content:space-between;align-items:center}
  h1{font-size:22px;margin:4px 0}
  .gear{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer;padding:6px}
  .from{font-size:14px;color:var(--mut);margin:8px 0 10px}
  .from b{color:var(--txt)}
  .search{position:relative}
  input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#11141a;color:var(--txt);font-size:17px}
  .sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:5}
  .sugg div{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .sugg div:last-child{border-bottom:0}
  .sugg small{display:block;color:var(--mut);font-size:13px}
  .chips{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
  .chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--txt);font-size:14px;cursor:pointer}
  .chip.on{background:var(--acc);border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
  .card.best{border-color:var(--ok)}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-weight:700}
  .time{font-size:24px;font-weight:800;white-space:nowrap}
  .badge{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;margin:6px 6px 0 0;background:#252a35}
  .badge.ok{background:rgba(47,191,113,.18);color:var(--ok)}
  .bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:10px 0;background:var(--ok)}
  .bar span{display:block;height:100%}
  .stats{font-size:13px;color:var(--mut);line-height:1.6}
  .stats b{color:var(--txt)}
  a.go{display:block;text-align:center;margin-top:12px;padding:15px;border-radius:12px;background:var(--ok);color:#06210f;text-decoration:none;font-weight:800;font-size:17px}
  a.go.sec{background:#252a35;color:var(--txt);font-weight:600;font-size:15px;padding:11px}
  button.wide{width:100%;padding:12px;margin-top:12px;border:0;border-radius:12px;background:#252a35;color:var(--txt);font-size:15px;font-weight:600;cursor:pointer}
  .msg{margin-top:12px;padding:12px;border-radius:10px;background:#252a35;font-size:14px}
  .msg.err{background:rgba(229,72,77,.15);color:#ff9a9d}
  details summary{cursor:pointer;color:var(--mut);margin-top:14px}
  #settings{display:none}
  #settings.open{display:block}
  #settings label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
</style>
</head>
<body>
<header>
  <h1>Fluide</h1>
  <button class="gear" id="gearBtn" type="button" aria-label="Réglages">⚙︎</button>
</header>

<div id="settings" class="card">
  <label for="key">Clé API Google</label>
  <input id="key" type="password" placeholder="AIza..." autocomplete="off">
  <button class="wide" id="save" type="button">Enregistrer</button>
</div>

<div class="from" id="from">📍 Recherche de ta position…</div>

<div class="search">
  <input id="dest" placeholder="Où vas-tu ?" autocomplete="off" enterkeyhint="search">
  <div class="sugg" id="sugg" hidden></div>
</div>

<div class="chips">Temps perdu accepté :
  <button class="chip" data-tol="5" type="button">+5</button>
  <button class="chip on" data-tol="10" type="button">+10</button>
  <button class="chip" data-tol="15" type="button">+15 min</button>
</div>

<div id="out"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d=''){ try{ return localStorage.getItem('fluide_'+k) ?? d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem('fluide_'+k, v) }catch(e){} }
};
const KEY = () => store.get('key');

// ---------- Réglages (juste la clé, une seule fois) ----------
$('key').value = KEY();
$('gearBtn').onclick = () => $('settings').classList.toggle('open');
$('save').onclick = () => {
  store.set('key', $('key').value.trim());
  $('settings').classList.remove('open');
  msg('Clé enregistrée. Tape ta destination.');
};
if(!KEY()){ $('settings').classList.add('open') }

function msg(t, err){ $('out').innerHTML = `<div class="msg ${err?'err':''}">${t}</div>` }

// ---------- Position automatique ----------
let pos = null;
function locate(){
  if(!navigator.geolocation){ $('from').textContent = '📍 Localisation indisponible'; return }
  navigator.geolocation.getCurrentPosition(p => {
    pos = {latitude:p.coords.latitude, longitude:p.coords.longitude};
    $('from').innerHTML = '📍 Départ : <b>ta position actuelle</b>';
  }, () => { $('from').textContent = '📍 Autorise la localisation pour partir de ta position' },
  {enableHighAccuracy:true, timeout:10000, maximumAge:30000});
}
locate();

// ---------- Tolérance ----------
let tol = +store.get('tol', '10');
document.querySelectorAll('.chip').forEach(c => {
  c.classList.toggle('on', +c.dataset.tol === tol);
  c.onclick = () => {
    tol = +c.dataset.tol; store.set('tol', tol);
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    if(dest) run();
  };
});

// ---------- Suggestions d'adresses (Google Places) ----------
let dest = null, timer = null;
let session = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
$('dest').oninput = () => {
  clearTimeout(timer);
  const q = $('dest').value.trim();
  if(q.length < 3){ $('sugg').hidden = true; return }
  timer = setTimeout(() => suggest(q), 250);
};
async function suggest(q){
  if(!KEY()) return;
  const body = {input:q, languageCode:'fr', includedRegionCodes:['fr'], sessionToken:session};
  if(pos) body.locationBias = {circle:{center:pos, radius:50000}};
  try{
    const r = await fetch('https://places.googleapis.com/v1/places:autocomplete', {
      method:'POST', headers:{'Content-Type':'application/json','X-Goog-Api-Key':KEY()}, body:JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error?.message || r.status);
    const list = (d.suggestions || []).filter(s => s.placePrediction).slice(0,5);
    $('sugg').innerHTML = list.map((s,i) => {
      const p = s.placePrediction, f = p.structuredFormat || {};
      return `<div data-i="${i}">${f.mainText?.text || p.text.text}<small>${f.secondaryText?.text || ''}</small></div>`;
    }).join('');
    $('sugg').hidden = !list.length;
    $('sugg').querySelectorAll('div').forEach(el => el.onclick = () => {
      const p = list[+el.dataset.i].placePrediction;
      dest = {placeId:p.placeId, label:p.text.text};
      $('dest').value = p.text.text;
      $('sugg').hidden = true;
      $('dest').blur();
      session = crypto.randomUUID ? crypto.randomUUID() : String(Math.random());
      run();
    });
  }catch(e){ msg('Suggestions indisponibles : ' + e.message, true) }
}

// ---------- Géo ----------
function decode(str){
  let i=0, lat=0, lng=0, pts=[];
  while(i<str.length){
    let b, s=0, r=0;
    do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<s; s+=5 }while(b>=32);
    lat += (r&1) ? ~(r>>1) : (r>>1);
    s=0; r=0;
    do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<s; s+=5 }while(b>=32);
    lng += (r&1) ? ~(r>>1) : (r>>1);
    pts.push([lat/1e5, lng/1e5]);
  }
  return pts;
}
function hav(a,b){
  const R=6371, t=x=>x*Math.PI/180, dLa=t(b[0]-a[0]), dLo=t(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// ---------- Itinéraires + score de fluidité ----------
const FIELDS = 'routes.duration,routes.staticDuration,routes.distanceMeters,routes.description,routes.polyline.encodedPolyline,routes.travelAdvisory.speedReadingIntervals';

async function routes(){
  const r = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':KEY(),'X-Goog-FieldMask':FIELDS},
    body: JSON.stringify({
      origin:{location:{latLng:pos}}, destination:{placeId:dest.placeId},
      travelMode:'DRIVE', routingPreference:'TRAFFIC_AWARE', computeAlternativeRoutes:true,
      extraComputations:['TRAFFIC_ON_POLYLINE'], polylineQuality:'HIGH_QUALITY', languageCode:'fr-FR'
    })
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message || r.status);
  return (d.routes || []).map(analyse);
}

// Score : km bouchés ×4, km ralentis ×1,5, chaque zone de freinage ×1,5. Plus bas = plus fluide.
function analyse(r){
  const pts = decode(r.polyline.encodedPolyline), cum=[0];
  for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
  const total = cum[cum.length-1] || 0.001;
  const segs = (r.travelAdvisory?.speedReadingIntervals || []).map(s => {
    const a = s.startPolylinePointIndex || 0, b = Math.min(s.endPolylinePointIndex || 0, pts.length-1);
    return {speed:s.speed || 'NORMAL', km:Math.max(0, cum[b]-cum[a])};
  });
  let jam=0, slow=0, brakes=0, prev='NORMAL';
  for(const s of segs){
    if(s.speed==='TRAFFIC_JAM') jam+=s.km;
    if(s.speed==='SLOW') slow+=s.km;
    if(prev==='NORMAL' && s.speed!=='NORMAL') brakes++;
    prev = s.speed;
  }
  return {name:r.description || 'Itinéraire', pts, segs, total, dur:parseInt(r.duration)/60,
          km:r.distanceMeters/1000, jam, slow, brakes, score: jam*4 + slow*1.5 + brakes*1.5};
}

function mapsLink(r){
  const P = r.pts, w = [0.25,0.5,0.75].map(f => P[Math.floor(f*(P.length-1))]);
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate'
    + '&origin=' + pos.latitude + ',' + pos.longitude
    + '&destination=' + encodeURIComponent(dest.label)
    + '&destination_place_id=' + encodeURIComponent(dest.placeId)
    + '&waypoints=' + encodeURIComponent(w.map(p => p[0].toFixed(5)+','+p[1].toFixed(5)).join('|'));
}

function bar(r){
  const col = {NORMAL:'var(--ok)', SLOW:'var(--slow)', TRAFFIC_JAM:'var(--jam)'};
  return '<div class="bar">' + r.segs.map(s =>
    `<span style="width:${(s.km/r.total*100).toFixed(2)}%;background:${col[s.speed]||col.NORMAL}"></span>`).join('') + '</div>';
}

async function run(){
  if(!KEY()){ $('settings').classList.add('open'); return msg('Ajoute ta clé API (⚙︎).', true) }
  if(!pos){ locate(); return msg('Position introuvable : autorise la localisation puis réessaie.', true) }
  msg('Calcul de la route la plus fluide…');
  try{
    const list = await routes();
    if(!list.length) return msg('Aucun itinéraire trouvé.', true);
    const fastest = Math.min(...list.map(r => r.dur));
    const ok = list.filter(r => r.dur <= fastest + tol).sort((a,b) => a.score-b.score || a.dur-b.dur);
    const best = ok[0], others = list.filter(r => r !== best).sort((a,b) => a.score-b.score);
    const extra = r => Math.round(r.dur - fastest);
    const stats = r => `<b>${r.jam.toFixed(1)} km</b> bouchés · <b>${r.slow.toFixed(1)} km</b> ralentis · <b>${r.brakes}</b> zone(s) de freinage · ${r.km.toFixed(0)} km`;

    let h = `<div class="card best">
      <div class="top"><div class="name">${best.name}</div><div class="time">${Math.round(best.dur)} min</div></div>
      <span class="badge ok">La plus fluide</span>${extra(best) ? `<span class="badge">+${extra(best)} min vs la plus rapide</span>` : '<span class="badge">aussi la plus rapide</span>'}
      ${bar(best)}<div class="stats">${stats(best)}</div>
      <a class="go" href="${mapsLink(best)}" target="_blank" rel="noopener">C'est parti</a>
    </div>`;
    if(others.length){
      h += `<details><summary>Autres itinéraires (${others.length})</summary>` + others.map(r => `<div class="card">
        <div class="top"><div class="name">${r.name}</div><div class="time">${Math.round(r.dur)} min</div></div>
        ${bar(r)}<div class="stats">${stats(r)}</div>
        <a class="go sec" href="${mapsLink(r)}" target="_blank" rel="noopener">Prendre celui-ci</a></div>`).join('') + '</details>';
    }
    h += `<button class="wide" type="button" onclick="locate();run()">↻ Recalculer avec le trafic actuel</button>`;
    $('out').innerHTML = h;
  }catch(e){ msg('Erreur : ' + e.message, true) }
}
</script>
</body>
</html>
